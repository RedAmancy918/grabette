name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff
        # Config in the root pyproject.toml ([tool.ruff]): pyflakes +
        # pycodestyle E4/E7/E9, explicitly selected; proto stubs excluded.
        # VERSION PINNED ON PURPOSE. `uvx ruff` floats to the latest release,
        # which silently changes the gate: ruff 0.16 widened the default rule
        # set and every PR started failing on untouched files. Bump this
        # deliberately, with the resulting diff reviewed — not by surprise.
        run: uvx ruff@0.16.0 check packages

  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install system dependencies
        # python-prctl (required by picamera2) has only a source distribution.
        # uv lock --check rebuilds it from the sdist on a cold cache, which
        # needs the libcap development headers.
        run: sudo apt-get install -y libcap-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Lock is up to date
        run: uv lock --check

      - name: Build the full workspace environment
        # Resolves and installs every member on a clean machine — the real
        # gate that the single workspace lock works end to end.
        run: uv sync --all-packages

      - name: Import smoke test
        # The device services import with no exotic system libs.
        run: |
          uv run python - <<'PY'
          import importlib, sys
          mods = ["grabette", "casquette", "gripette"]
          failed = []
          for m in mods:
              try:
                  importlib.import_module(m)
                  print(f"OK   {m}")
              except Exception as e:
                  print(f"FAIL {m}: {type(e).__name__}: {e}")
                  failed.append(m)
          sys.exit(1 if failed else 0)
          PY

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Device-package unit tests
        # Behavioural regression tests (grabette SessionManager, ...), run
        # against a temp-dir/mock path — no hardware. Extend per package.
        #
        # --extra hf installs the fleet/HF feature set (aiohttp, huggingface-hub).
        # It is optional at RUNTIME — a grabette with no fleet doesn't need it —
        # but the group start/stop tests exercise exactly that code, and
        # relay_client imports aiohttp at module level. The alternative, putting a
        # runtime library in the `test` extra, would blur what that extra means:
        # test tooling, installed on top of the feature set under test.
        #
        # --extra vision installs opencv-python-headless for the same reason:
        # grabette.hardware.oakd imports cv2 at module level, so without it
        # test_hardware_error.py cannot even be COLLECTED — and a collection
        # error fails the whole run, not just that file. It lives in its own
        # extra rather than in `rpi`, which is unusable off a Pi (picamera2,
        # depthai, gpiod) and so can never be installed here.
        #
        # --extra ui installs gradio: the dashboard tests import grabette.ui.app.
        run: uv run --package grabette --extra test --extra hf --extra vision --extra ui pytest packages/grabette/tests -q
